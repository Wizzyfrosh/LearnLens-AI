name: Turnstile POC validation

on:
  push:
    branches:
      - phase-6-6-2-turnstile-custom-provider-poc
    paths:
      - "functions/**"
      - "poc/turnstile-hosted/**"
      - "poc/turnstile-extension/**"
      - "scripts/verify-turnstile-hosted.mjs"
      - "package.json"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/turnstile-poc.yml"
  pull_request:
    branches:
      - phase-6-6-app-check-poc
    paths:
      - "functions/**"
      - "poc/turnstile-hosted/**"
      - "poc/turnstile-extension/**"
      - "scripts/verify-turnstile-hosted.mjs"
      - "package.json"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/turnstile-poc.yml"

permissions:
  contents: read

jobs:
  validate-turnstile-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Validate Firestore challenge TTL configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const firebase = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
          const indexes = JSON.parse(fs.readFileSync("firestore.indexes.json", "utf8"));
          if (firebase.firestore?.indexes !== "firestore.indexes.json") {
            throw new Error("firebase.json must register firestore.indexes.json");
          }
          const expected = new Set([
            "appCheckChallengeSessions:expiresAt",
            "appCheckChallengeRateLimits:expiresAt",
            "appCheckChallengeGlobalBudgets:expiresAt"
          ]);
          for (const item of indexes.fieldOverrides ?? []) {
            if (item.ttl === true) expected.delete(item.collectionGroup + ":" + item.fieldPath);
          }
          if (expected.size !== 0) {
            throw new Error("Missing Firestore TTL policies: " + [...expected].join(", "));
          }
          NODE

      - name: Verify hosted Turnstile challenge page
        run: npm run poc:turnstile-hosted:verify

      - name: Verify Turnstile CustomProvider coordinator
        run: npm run poc:turnstile-extension:verify

      - name: Run Firestore Security Rules tests
        run: npm run test:rules

      - name: Run isolated Turnstile validator tests
        working-directory: functions
        run: node --test lib/functions/tests/turnstile-validation.test.js

      - name: Run challenge-session, service, rate-limit and global-budget Firestore emulator tests
        run: npx firebase emulators:exec --only firestore --project demo-learnlens-functions "node --test functions/lib/functions/tests/app-check-challenge-sessions.test.js functions/lib/functions/tests/app-check-challenge-service.test.js functions/lib/functions/tests/challenge-rate-limit.test.js functions/lib/functions/tests/global-challenge-budget.test.js functions/lib/functions/tests/challenge-http.test.js"
