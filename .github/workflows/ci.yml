name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: learnlens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Set up Node.js 22 for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Firestore Security Rules tests
        run: npm run test:rules
      - name: Firebase Admin sync backend integration tests
        run: npm run test:functions
      - name: Restore Node.js 24 for extension build
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_DEBUG: "true"
        run: npm run build
      - name: Verify Chrome extension package
        run: npm run verify:extension
      - name: Verify isolated App Check compatibility lab
        run: npm run poc:app-check:verify
      - name: Upload Chrome extension build
        uses: actions/upload-artifact@v4
        with:
          name: learnlens-chrome-extension
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload isolated App Check POC build
        uses: actions/upload-artifact@v4
        with:
          name: learnlens-app-check-poc
          path: poc/app-check-extension/dist/
          if-no-files-found: error
          retention-days: 30
