name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: learnlens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify Chrome extension package
        run: npm run verify:extension

      - name: Upload Chrome extension build
        uses: actions/upload-artifact@v4
        with:
          name: learnlens-chrome-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14
